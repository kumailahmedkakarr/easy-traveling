<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A2540">
<title>Admin · Ease Traveling</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#F1F5F9;color:#0A2540}
  .hidden{display:none!important}
  .in{width:100%;border:1px solid #E2E8F0;border-radius:.75rem;padding:.6rem .85rem;font-size:.85rem;background:#F8FAFC;outline:none}
  .in:focus{border-color:#0868C8;box-shadow:0 0 0 3px rgba(8,104,200,.18)}
  .btn{background:#0868C8;color:#fff;font-weight:800;font-size:.8rem;padding:.6rem 1rem;border-radius:.75rem}
  .btn:hover{background:#064F9C}
  .btn-ghost{background:#fff;border:1px solid #E2E8F0;color:#0A2540;font-weight:700;font-size:.8rem;padding:.55rem .9rem;border-radius:.75rem}
  .btn-ghost:hover{border-color:#0868C8;color:#0868C8}
  .card{background:#fff;border-radius:1rem;box-shadow:0 6px 20px -12px rgba(10,37,64,.3);border:1px solid #E2E8F0}
  th{white-space:nowrap}
  .bar{background:linear-gradient(180deg,#0A84F0,#0868C8);border-radius:.4rem .4rem 0 0}
  @media print{
    body *{visibility:hidden}
    #print-area,#print-area *{visibility:visible}
    #print-area{position:absolute;left:0;top:0;width:100%}
    .no-print{display:none!important}
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0A2540,#0B4A9E)">
  <form id="login-form" class="bg-white rounded-3xl shadow-2xl p-7 w-full max-w-sm space-y-4">
    <div class="text-center">
      <img src="/assets/images/logo.png" alt="" class="w-16 h-16 mx-auto object-contain">
      <h1 class="text-xl font-extrabold mt-2">Admin sign in</h1>
      <p class="text-xs text-slate-500">Ease Traveling control panel</p>
    </div>
    <div><label class="block text-xs font-bold text-slate-600 mb-1" for="email">Email</label><input id="email" type="email" autocomplete="username" required class="in"></div>
    <div><label class="block text-xs font-bold text-slate-600 mb-1" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required class="in"></div>
    <p id="login-error" class="hidden text-xs font-semibold text-rose-600"></p>
    <button class="btn w-full !py-3">Sign in</button>
  </form>
</div>

<!-- Panel -->
<div id="panel" class="hidden">
  <header class="bg-[#0A2540] text-white no-print">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="flex items-center gap-2 font-extrabold"><img src="/assets/images/logo.png" alt="" class="w-8 h-8 rounded-lg bg-white object-contain">Ease Traveling <span class="text-xs font-bold text-blue-200">Admin</span></span>
      <button id="logout" class="text-xs font-bold text-blue-100 hover:text-white"><i class="fa-solid fa-right-from-bracket mr-1"></i>Logout</button>
    </div>
  </header>
  <div class="max-w-7xl mx-auto px-4 py-4">
    <nav id="tabs" class="flex gap-2 mb-4 overflow-x-auto no-print"></nav>
    <section id="view"></section>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
